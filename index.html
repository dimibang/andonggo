<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>안동고등학교 개교 75주년 대축제 현황</title>

  <meta property="og:title" content="[안동고] 개교 75주년 대축제 참석 신청 및 현황" />
  <meta property="og:description" content="2026. 10. 10.(토) 안동체육관 | 실시간 접수 현황 보기" />
  <meta property="og:image" content="./KakaoTalk_20260819_161509609.jpg" />

  <style>
    :root {
      --primary-color: #0b4da2;
      --accent-color: #e02b20;
      --bg-glass: rgba(255, 255, 255, 0.92);
      --text-main: #1f2937;
      --text-sub: #4b5563;
      --border-color: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, "Noto Sans KR", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0f172a;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    /* 모바일 컨테이너 */
    .container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: url('./KakaoTalk_20260819_161509609.jpg') no-repeat top center;
      background-size: contain;
      background-color: #f1f5f9;
      position: relative;
      padding-bottom: 90px;
      box-shadow: 0 0 25px rgba(0,0,0,0.3);
    }

    /* 포스터 상단 영역 확보용 스페이서 */
    .poster-hero {
      width: 100%;
      height: 380px;
    }

    /* 메인 컨텐츠 영역 */
    .content-wrap {
      padding: 0 16px;
      position: relative;
      z-index: 10;
    }

    /* 카드 베이스 스타일 (Glassmorphism) */
    .card {
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    /* 헤더 텍스트 */
    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary-color);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }
    .btn-refresh {
      margin-left: auto;
      border: 1px solid var(--border-color);
      background: #ffffff;
      color: var(--text-sub);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-refresh:active { background: #f1f5f9; }
    .count-note {
      font-size: 0.72rem;
      color: var(--text-sub);
      margin-top: 10px;
      line-height: 1.4;
    }
    .updated-at {
      font-size: 0.72rem;
      color: #94a3b8;
      text-align: right;
      margin-top: 10px;
    }

    /* 전체 종합 현황 카드 */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
    }
    .summary-box {
      background: #ffffff;
      padding: 12px 6px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }
    .summary-label {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-bottom: 4px;
    }
    .summary-value {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text-main);
    }
    .summary-value.highlight {
      color: var(--primary-color);
    }

    /* 탭 네비게이션 */
    .tab-nav {
      display: flex;
      background: #e2e8f0;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 14px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: none;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: #ffffff;
      color: var(--primary-color);
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    /* 테이블 스타일 */
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .table-container {
      max-height: 400px;
      overflow-y: auto;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #ffffff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 0.88rem;
    }
    thead th {
      position: sticky;
      top: 0;
      background: #f8fafc;
      color: var(--text-sub);
      font-weight: 600;
      padding: 10px 6px;
      border-bottom: 1px solid var(--border-color);
      z-index: 2;
    }
    tbody td {
      padding: 10px 6px;
      border-bottom: 1px solid #f1f5f9;
      color: var(--text-main);
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:nth-child(even) { background-color: #fafafa; }
    .highlight-name {
      font-weight: 600;
      color: #1e3a8a;
    }
    tbody tr.has td { background-color: #f0f7ff; }
    tbody tr.has .highlight-name { color: #0b4da2; }
    .cnt-zero { color: #cbd5e1; }
    .msg-row td {
      padding: 24px 8px;
      color: #94a3b8;
      font-size: 0.85rem;
    }

    /* 하단 고정 신청 바 */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
      box-shadow: 0 -4px 15px rgba(0,0,0,0.06);
      z-index: 100;
    }
    .btn-apply-bottom {
      display: block;
      width: 100%;
      background: var(--primary-color);
      color: #ffffff;
      text-align: center;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      padding: 14px 0;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(11, 77, 162, 0.3);
    }

    .total-row td {
      font-weight: 800;
      background: #eef4fb;
      border-top: 2px solid var(--primary-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="poster-hero"></div>

    <div class="content-wrap">

      <div class="card">
        <div class="card-title">
          <span>📊</span> 실시간 접수 현황 요약
          <button class="btn-refresh" type="button" onclick="refresh()">↻ 새로고침</button>
        </div>
        <div class="summary-grid">
          <div class="summary-box">
            <div class="summary-label">동문 신청</div>
            <div class="summary-value" id="alumni-count">-</div>
          </div>
          <div class="summary-box">
            <div class="summary-label">동반 가족</div>
            <div class="summary-value" id="family-count">-</div>
          </div>
          <div class="summary-box">
            <div class="summary-label">총 참석 예상</div>
            <div class="summary-value highlight" id="total-count">-</div>
          </div>
        </div>
        <div class="count-note">같은 분이 여러 번 신청하면 1명으로 셉니다 · 동반 '3명 이상'은 3명으로 계산</div>
        <div class="updated-at" id="updated-at">불러오는 중…</div>
      </div>

      <div class="card">
        <div class="tab-nav">
          <button class="tab-btn active" onclick="switchTab('region')">지회별 현황</button>
          <button class="tab-btn" onclick="switchTab('grade')">기수별 현황</button>
        </div>

        <div id="tab-region" class="tab-content active">
          <div class="table-container">
            <table>
              <thead>
                <tr><th>지회명</th><th>동문</th><th>동반</th></tr>
              </thead>
              <tbody id="region-tbody">
                <tr class="msg-row"><td colspan="3">불러오는 중…</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <div id="tab-grade" class="tab-content">
          <div class="table-container">
            <table>
              <thead>
                <tr><th>기수</th><th>동문</th><th>동반</th></tr>
              </thead>
              <tbody id="grade-tbody">
                <tr class="msg-row"><td colspan="3">불러오는 중…</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>

    </div>
  </div>

  <div class="bottom-bar">
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSd5bh2hdk7dTFFIwamIilL0oMP4k6IyH2mhkoBXNUykuuRoaw/viewform"
       target="_blank"
       class="btn-apply-bottom">
      참석 신청하기 (구글 설문)
    </a>
  </div>

  <script>
    /* ════════════════════════════════════════════════
       구글 시트 '현황' 탭을 읽어옵니다. (중복 신청 제외 집계)
       A 지회명 / B 동문 / C 동반
       E 기수   / F 동문 / G 동반
       I 구분   / J 인원  (동문 신청 · 동반 가족 · 총 참석 예상)
       ════════════════════════════════════════════════ */
    const SHEET_ID   = "1fn7bFPkNrinGNX0iOstZ_ZupQMzHLy7tOJjdt-hg_Eo";
    const SHEET_NAME = "현황";
    const SHEET_URL  = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;

    let regionData = [], gradeData = [];
    let regionSum = null, gradeSum = null;
    let summary = {};

    const txt = c => (c && c.v != null) ? String(c.v).trim() : '';
    const num = c => {
      if (!c || c.v == null) return null;
      if (typeof c.v === 'number') return c.v;
      const n = parseFloat(String(c.v).replace(/[^\d.\-]/g, ''));
      return isNaN(n) ? null : n;
    };
    const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    async function loadLiveData() {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`
                + `?sheet=${encodeURIComponent(SHEET_NAME)}&range=A1:J80&headers=0&tqx=out:json&_=${Date.now()}`;

      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(`시트 응답 오류 (${res.status})`);

      const text  = await res.text();
      const match = text.match(/setResponse\(([\s\S]*)\)\s*;?\s*$/);
      if (!match) throw new Error('시트 응답 형식을 읽을 수 없습니다');

      const data = JSON.parse(match[1]);
      if (data.status === 'error') throw new Error('시트를 읽을 수 없습니다');

      const rows = (data.table && data.table.rows) || [];
      regionData = []; gradeData = [];
      regionSum = null; gradeSum = null;
      summary = {};

      for (const row of rows) {
        const c = row.c || [];

        // 숫자 칸이 비어 있는 줄(머리글 등)은 건너뜁니다.
        const rName = txt(c[0]), rVal = num(c[1]), rFam = num(c[2]) || 0;
        if (rName && rVal !== null) {
          if (rName === '계') regionSum = { current: rVal, family: rFam };
          else regionData.push({ name: rName, current: rVal, family: rFam });
        }

        const gName = txt(c[4]), gVal = num(c[5]), gFam = num(c[6]) || 0;
        if (gName && gVal !== null) {
          if (gName === '계') gradeSum = { current: gVal, family: gFam };
          else gradeData.push({ name: gName, current: gVal, family: gFam });
        }

        const sName = txt(c[8]), sVal = num(c[9]);
        if (sName && sVal !== null) summary[sName] = sVal;
      }

      if (!regionData.length && !gradeData.length) throw new Error('집계 데이터가 비어 있습니다');
    }

    function switchTab(type) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      if (type === 'region') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-region').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-grade').classList.add('active');
      }
    }

    const sumOf = list => ({
      current: list.reduce((s, i) => s + i.current, 0),
      family:  list.reduce((s, i) => s + i.family, 0)
    });

    function rowsHtml(list, total) {
      const body = list.map(item => `
        <tr class="${item.current > 0 ? 'has' : ''}">
          <td class="highlight-name">${esc(item.name)}</td>
          <td><strong class="${item.current > 0 ? '' : 'cnt-zero'}">${item.current}</strong></td>
          <td><span class="${item.family > 0 ? '' : 'cnt-zero'}">${item.family}</span></td>
        </tr>`).join('');
      return body + `
        <tr class="total-row">
          <td><strong>계</strong></td>
          <td><strong>${total.current}</strong></td>
          <td><strong>${total.family}</strong></td>
        </tr>`;
    }

    function renderTables() {
      const rTotal = regionSum || sumOf(regionData);
      const gTotal = gradeSum  || sumOf(gradeData);

      document.getElementById('region-tbody').innerHTML = rowsHtml(regionData, rTotal);
      document.getElementById('grade-tbody').innerHTML  = rowsHtml(gradeData,  gTotal);

      const alumni = summary['동문 신청'] != null ? summary['동문 신청'] : rTotal.current;
      const family = summary['동반 가족'] != null ? summary['동반 가족'] : rTotal.family;
      const total  = summary['총 참석 예상'] != null ? summary['총 참석 예상'] : alumni + family;

      document.getElementById('alumni-count').innerText = alumni + '명';
      document.getElementById('family-count').innerText = family + '명';
      document.getElementById('total-count').innerText  = total + '명';

      const d = new Date();
      const p = n => (n < 10 ? '0' + n : n);
      document.getElementById('updated-at').innerText =
        `업데이트 ${d.getMonth() + 1}. ${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())} 기준`;
    }

    function showError(err) {
      console.error(err);
      ['total-count', 'alumni-count', 'family-count'].forEach((id, i) => {
        document.getElementById(id).innerText = i === 0 ? '연결 오류' : '-';
      });
      document.getElementById('updated-at').innerHTML =
        `${esc(err.message || '불러오지 못했습니다')} · <a href="${SHEET_URL}" target="_blank">시트에서 확인 ›</a>`;
      const msg = `<tr class="msg-row"><td colspan="3">현황을 불러오지 못했습니다.</td></tr>`;
      document.getElementById('region-tbody').innerHTML = msg;
      document.getElementById('grade-tbody').innerHTML  = msg;
    }

    async function refresh() {
      document.getElementById('updated-at').innerText = '불러오는 중…';
      try { await loadLiveData(); renderTables(); }
      catch (e) { showError(e); }
    }

    document.addEventListener('DOMContentLoaded', refresh);
  </script>
</body>
</html>
