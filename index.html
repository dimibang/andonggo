<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>안동고등학교 개교 75주년 대축제 현황</title>
  
  <meta property="og:title" content="[안동고] 개교 75주년 대축제 참석 신청 및 현황" />
  <meta property="og:description" content="2026. 10. 10.(토) 안동체육관 | 실시간 접수 현황 보기" />
  <meta property="og:image" content="./KakaoTalk_20260819_161509609.jpg" />

  <style>
    :root {
      --primary-color: #0b4da2;
      --accent-color: #e02b20;
      --bg-glass: rgba(255, 255, 255, 0.92);
      --text-main: #1f2937;
      --text-sub: #4b5563;
      --border-color: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, "Noto Sans KR", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0f172a;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    /* 모바일 컨테이너 */
    .container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: url('./KakaoTalk_20260819_161509609.jpg') no-repeat top center;
      background-size: contain;
      background-color: #f1f5f9;
      position: relative;
      padding-bottom: 90px;
      box-shadow: 0 0 25px rgba(0,0,0,0.3);
    }

    /* 포스터 상단 영역 확보용 스페이서 */
    .poster-hero {
      width: 100%;
      height: 380px;
    }

    /* 메인 컨텐츠 영역 */
    .content-wrap {
      padding: 0 16px;
      position: relative;
      z-index: 10;
    }

    /* 신청하기 버튼 (상단 메인 CTA) */
    .btn-apply-main {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: linear-gradient(135deg, #e02b20 0%, #b91c1c 100%);
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 700;
      text-decoration: none;
      padding: 16px 20px;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(224, 43, 32, 0.4);
      margin-bottom: 20px;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .btn-apply-main:active {
      transform: scale(0.98);
      box-shadow: 0 4px 10px rgba(224, 43, 32, 0.3);
    }

    /* 카드 베이스 스타일 (Glassmorphism) */
    .card {
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    /* 헤더 텍스트 */
    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary-color);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    /* 전체 종합 현황 카드 */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
    }
    .summary-box {
      background: #ffffff;
      padding: 12px 6px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }
    .summary-label {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-bottom: 4px;
    }
    .summary-value {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text-main);
    }
    .summary-value.highlight {
      color: var(--primary-color);
    }

    /* 탭 네비게이션 */
    .tab-nav {
      display: flex;
      background: #e2e8f0;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 14px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: none;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: #ffffff;
      color: var(--primary-color);
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    /* 테이블 스타일 */
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .table-container {
      max-height: 400px;
      overflow-y: auto;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #ffffff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 0.88rem;
    }
    thead th {
      position: sticky;
      top: 0;
      background: #f8fafc;
      color: var(--text-sub);
      font-weight: 600;
      padding: 10px 6px;
      border-bottom: 1px solid var(--border-color);
      z-index: 2;
    }
    tbody td {
      padding: 10px 6px;
      border-bottom: 1px solid #f1f5f9;
      color: var(--text-main);
    }
    tbody tr:last-child td {
      border-bottom: none;
    }
    tbody tr:nth-child(even) {
      background-color: #fafafa;
    }
    .highlight-name {
      font-weight: 600;
      color: #1e3a8a;
    }
    .progress-pill {
      font-weight: 700;
      color: #059669;
      background: #ecfdf5;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 0.78rem;
    }

    /* 하단 고정 신청 바 (스크롤 시 편의용) */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
      box-shadow: 0 -4px 15px rgba(0,0,0,0.06);
      z-index: 100;
    }
    .btn-apply-bottom {
      display: block;
      width: 100%;
      background: var(--primary-color);
      color: #ffffff;
      text-align: center;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      padding: 14px 0;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(11, 77, 162, 0.3);
    }

    .total-row td {
      font-weight: 800;
      background: #eef4fb;
      border-top: 2px solid var(--primary-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="poster-hero"></div>

    <div class="content-wrap">
      
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSd5bh2hdk7dTFFIwamIilL0oMP4k6IyH2mhkoBXNUykuuRoaw/viewform" 
         target="_blank" 
         class="btn-apply-main">
        <span>📝</span> 개교 75주년 참석 신청하기
      </a>

      <div class="card">
        <div class="card-title">
          <span>📊</span> 실시간 접수 현황 요약
        </div>
        <div class="summary-grid">
          <div class="summary-box">
            <div class="summary-label">총 신청 인원</div>
            <div class="summary-value highlight" id="total-count">0명</div>
          </div>
          <div class="summary-box">
            <div class="summary-label">기수별 계</div>
            <div class="summary-value" id="grade-total">0명</div>
          </div>
          <div class="summary-box">
            <div class="summary-label">지회별 계</div>
            <div class="summary-value" id="region-total">0명</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="tab-nav">
          <button class="tab-btn active" onclick="switchTab('region')">지회별 현황</button>
          <button class="tab-btn" onclick="switchTab('grade')">기수별 현황</button>
        </div>

        <div id="tab-region" class="tab-content active">
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>지회명</th>
                  <th>신청(명)</th>
                </tr>
              </thead>
              <tbody id="region-tbody">
                </tbody>
            </table>
          </div>
        </div>

        <div id="tab-grade" class="tab-content">
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>기수</th>
                  <th>신청(명)</th>
                </tr>
              </thead>
              <tbody id="grade-tbody">
                </tbody>
            </table>
          </div>
        </div>

      </div>

    </div>
  </div>

  <div class="bottom-bar">
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSd5bh2hdk7dTFFIwamIilL0oMP4k6IyH2mhkoBXNUykuuRoaw/viewform" 
       target="_blank" 
       class="btn-apply-bottom">
      참석 신청하기 (구글 설문)
    </a>
  </div>

  <script>
    // 구글 설문 응답 시트
    const SHEET_ID = "1fh7bFPkNrinGNXOiOstZ_ZupQMzHly7tOJjdt-hg_Eo";
    const RESPONSE_SHEET_GID = "786539282";

    // 1. 지회별 기본 데이터 (13개 지회)
    const regionData = [
      { name: "안동지회", current: 0 },
      { name: "재경지회", current: 0 },
      { name: "부산지회", current: 0 },
      { name: "대구지회", current: 0 },
      { name: "대전지회", current: 0 },
      { name: "울산지회", current: 0 },
      { name: "영주지회", current: 0 },
      { name: "구미지회", current: 0 },
      { name: "창원지회", current: 0 },
      { name: "문경지회", current: 0 },
      { name: "경주지회", current: 0 },
      { name: "안동시청동문회", current: 0 },
      { name: "기타", current: 0 }
    ];

    // 2. 기수별 데이터 (1회 ~ 75회 자동 생성)
    const gradeData = [];
    for (let i = 1; i <= 75; i++) {
      gradeData.push({
        name: i + "회",
        target: 20, // 기본 목표치
        current: 0,
        meal: 0
      });
    }

    // 구글 응답 시트를 읽어 지회·기수를 자동 집계한다.
    async function loadLiveData() {
      const queryUrl =
        `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq` +
        `?gid=${RESPONSE_SHEET_GID}&tqx=out:json&_=${Date.now()}`;

      const response = await fetch(queryUrl, { cache: 'no-store' });
      if (!response.ok) throw new Error(`시트 응답 오류: ${response.status}`);

      const text = await response.text();
      const match = text.match(/google\.visualization\.Query\.setResponse\((.*)\);/s);
      if (!match) throw new Error('구글 시트 응답 형식을 읽을 수 없습니다.');

      const data = JSON.parse(match[1]);
      if (data.status === 'error') throw new Error('구글 시트가 공개되어 있지 않습니다.');

      // 다시 불러올 때 중복 집계되지 않도록 초기화
      regionData.forEach(item => item.current = 0);
      gradeData.forEach(item => item.current = 0);

      for (const row of data.table.rows || []) {
        const cells = row.c || [];
        const gradeText = String(cells[3]?.v ?? '').trim(); // D열: 졸업 기수
        const regionName = String(cells[4]?.v ?? '').trim(); // E열: 소속 지회

        if (regionName) {
          const region = regionData.find(item => item.name === regionName)
            || regionData.find(item => item.name === '기타');
          region.current += 1;
        }

        const gradeMatch = gradeText.match(/^(\d+)회/);
        if (gradeMatch) {
          const gradeNumber = Number(gradeMatch[1]);
          if (gradeNumber >= 1 && gradeNumber <= 75) {
            gradeData[gradeNumber - 1].current += 1;
          }
        }
      }
    }

    // 탭 전환 함수
    function switchTab(type) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      if (type === 'region') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-region').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-grade').classList.add('active');
      }
    }

    // 데이터 렌더링 함수
    function renderTables() {
      const regionTotal = regionData.reduce((sum, item) => sum + item.current, 0);
      const gradeTotal = gradeData.reduce((sum, item) => sum + item.current, 0);

      // 1. 지회별 현황 + 마지막 계
      const regionTbody = document.getElementById('region-tbody');
      regionTbody.innerHTML = regionData.map(item => `
        <tr>
          <td class="highlight-name">${item.name}</td>
          <td><strong>${item.current}</strong></td>
        </tr>
      `).join('') + `
        <tr class="total-row">
          <td><strong>계</strong></td>
          <td><strong>${regionTotal}</strong></td>
        </tr>
      `;

      // 2. 기수별 현황 + 마지막 계
      const gradeTbody = document.getElementById('grade-tbody');
      gradeTbody.innerHTML = gradeData.map(item => `
        <tr>
          <td class="highlight-name">${item.name}</td>
          <td><strong>${item.current}</strong></td>
        </tr>
      `).join('') + `
        <tr class="total-row">
          <td><strong>계</strong></td>
          <td><strong>${gradeTotal}</strong></td>
        </tr>
      `;

      // 3. 실시간 접수 현황 요약
      // 동일한 신청 원장을 지회별/기수별로 각각 집계하므로 정상 연결 시 세 값은 같다.
      document.getElementById('total-count').innerText = regionTotal + '명';
      document.getElementById('grade-total').innerText = gradeTotal + '명';
      document.getElementById('region-total').innerText = regionTotal + '명';
    }

    // 초기 실행
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        await loadLiveData();
        renderTables();
      } catch (error) {
        console.error(error);
        document.getElementById('total-count').innerText = '연결 오류';
        document.getElementById('grade-total').innerText = '-';
        document.getElementById('region-total').innerText = '-';
      }
    });
  </script>
</body>
</html>
